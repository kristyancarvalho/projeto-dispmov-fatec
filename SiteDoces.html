    <script>
        document.querySelectorAll('.polaroid-link').forEach((link) => {
            link.addEventListener('click', () => {
                const nome = link.querySelector('p').textContent;
                const imagem = link.querySelector('img').src;
                const destino = new URL('detalhes.html', window.location.href);
                destino.searchParams.set('doce', nome);
                destino.searchParams.set('imagem', imagem);
                link.href = destino.href;
            });
        });
    </script>
